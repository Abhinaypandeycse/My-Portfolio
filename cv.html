<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume - Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      background-color: #f4f4f4;
      min-height: 100vh;
    }

    .container {
      display: flex;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      padding-top: 20px;
      position: fixed;
      height: 100%;
      overflow-y: auto;
    }

    .sidebar nav ul {
      list-style: none;
      padding: 0;
    }

    .sidebar nav ul li {
      padding: 15px;
    }

    .sidebar nav ul li a {
      text-decoration: none;
      color: white;
      display: block;
      font-weight: bold;
      transition: 0.3s;
    }

    .sidebar nav ul li a:hover {
      background-color: #34495e;
      padding-left: 10px;
    }

    /* Main content */
    .main {
      margin-left: 250px;
      padding: 40px 20px;
      flex: 1;
    }

    .resume-container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      margin: auto;
    }

    .section-title {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }

    .pdf-viewer {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }

    .download-btn {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .download-btn a {
      text-decoration: none;
      background-color: #007BFF;
      color: white;
      padding: 12px 24px;
      border-radius: 5px;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    .download-btn a:hover {
      background-color: #0056b3;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
      }

      .pdf-viewer {
        height: 500px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="/">HOME</a></li>
          <li><a href="/intro.html">ABOUT ME</a></li>
          <li><a href="/skills.html">SKILLS & EXPERTISE</a></li>
          <li><a href="/project.html">PROJECT</a></li>
          <li><a href="/cv.html">RESUME</a></li>
          <li><a href="/education.html">EDUCATION</a></li>
          <li><a href="/contact.html">CONTACT ME</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="resume-container">
        <h1 class="section-title">My Resume</h1>

        <!-- PDF Viewer -->
        <div class="pdf-viewer">
          <iframe src="ABHINAY_PANDEY_RESUME (5).pdf" width="100%" height="100%" style="border: none;"></iframe>
        </div>

        <!-- Download Button -->
        <div class="download-btn">
          <a href="ABHINAY_PANDEY_RESUME (5).pdf" download="Abhinay_Pandey_Resume.pdf">Download Resume (PDF)</a>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
