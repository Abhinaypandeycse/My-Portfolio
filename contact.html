<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      padding-top: 20px;
      position: fixed;
      height: 100%;
      overflow-y: auto;
      transition: all 0.3s ease;
    }

    .sidebar nav ul {
      list-style: none;
      padding: 0;
    }

    .sidebar nav ul li {
      padding: 15px;
    }

    .sidebar nav ul li a {
      text-decoration: none;
      color: white;
      display: block;
      font-weight: bold;
      transition: 0.3s;
    }

    .sidebar nav ul li a:hover {
      background-color: #34495e;
      padding-left: 10px;
    }

    .main-content {
      margin-left: 250px;
      padding: 20px;
      flex: 1;
      background-color: #f4f4f4;
    }

    .contact-container {
      max-width: 600px;
      background: #fff;
      padding: 30px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .main-content {
        margin-left: 0;
      }

      .sidebar nav ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .sidebar nav ul li {
        flex: 1 0 50%;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .sidebar nav ul li {
        flex: 1 0 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <nav>
      <ul>
        <li><a href="/">HOME</a></li>
        <li><a href="/intro.html">ABOUT ME</a></li>
        <li><a href="/skills.html">SKILLS & EXPERTIES</a></li>
        <li><a href="/project.html">PROJECT</a></li>
        <li><a href="/cv.html">RESUME</a></li>
        <li><a href="/education.html">EDUCATION</a></li>
        <li><a href="/contact.html">CONTACT ME</a></li>
      </ul>
    </nav>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="contact-container">
      <h2>Contact Me</h2>
      <form action="mailto:your-email@example.com" method="POST" enctype="text/plain">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
